  <rect x="560" y="120" width="500" height="280" rx="20" fill="rgba(124,92,255,0.05)" stroke="rgba(124,92,255,0.42)" stroke-width="1.5"/>
  <text x="580" y="156" font-size="12" font-weight="700" fill="#b896ff" letter-spacing="2">STATE</text>

  <g transform="translate(580,180)">
    <rect width="220" height="100" rx="12" fill="rgba(15,16,48,0.55)" stroke="rgba(124,92,255,0.32)"/>
    <text x="14" y="22" fill="#b896ff" font-size="10" font-weight="700" letter-spacing="1">RDS · POSTGRES 15</text>
    <text x="14" y="42" fill="#f0f1ff" font-size="14" font-weight="700">gopnik-prod (multi-AZ)</text>
    <text x="14" y="60" fill="#aebbe0" font-size="11">db.t4g.medium · 50 GB encrypted</text>
    <text x="14" y="76" fill="#aebbe0" font-size="11">7-day backups · pitr</text>
    <text x="14" y="92" fill="#aebbe0" font-size="11">12 rwaise_* tables + ENUMs</text>
  </g>
  <g transform="translate(820,180)">
    <rect width="220" height="100" rx="12" fill="rgba(15,16,48,0.55)" stroke="rgba(124,92,255,0.32)"/>
    <text x="14" y="22" fill="#b896ff" font-size="10" font-weight="700" letter-spacing="1">ELASTICACHE · REDIS 7</text>
    <text x="14" y="42" fill="#f0f1ff" font-size="14" font-weight="700">gopnik-prod (1+1 replica)</text>
    <text x="14" y="60" fill="#aebbe0" font-size="11">cache.t4g.micro</text>
    <text x="14" y="76" fill="#aebbe0" font-size="11">Feature flag cache (5 s TTL)</text>
    <text x="14" y="92" fill="#aebbe0" font-size="11">flask-limiter store</text>
  </g>
  <g transform="translate(580,300)">
    <rect width="460" height="80" rx="12" fill="rgba(15,16,48,0.55)" stroke="rgba(124,92,255,0.32)"/>
    <text x="14" y="22" fill="#b896ff" font-size="10" font-weight="700" letter-spacing="1">S3 · STATIC + UPLOADS (optional)</text>
    <text x="14" y="42" fill="#f0f1ff" font-size="14" font-weight="700">rwaise-uploads</text>
    <text x="14" y="60" fill="#aebbe0" font-size="11">Cap-table CSVs · prospectus PDFs · MPT metadata JSON</text>
    <text x="14" y="76" fill="#aebbe0" font-size="11">Server-side encryption (SSE-S3) · versioning ON</text>
  </g>

  <!-- ═══ AI group ═══ -->
  <rect x="1080" y="120" width="480" height="280" rx="20" fill="rgba(229,49,138,0.05)" stroke="rgba(229,49,138,0.42)" stroke-width="1.5"/>
  <text x="1100" y="156" font-size="12" font-weight="700" fill="#ff7eb6" letter-spacing="2">AI · BEDROCK</text>

  <g transform="translate(1100,180)">
    <rect width="440" height="100" rx="12" fill="rgba(15,16,48,0.55)" stroke="rgba(229,49,138,0.42)" stroke-width="1.5"/>
    <text x="14" y="22" fill="#ff7eb6" font-size="10" font-weight="700" letter-spacing="1">BEDROCK RUNTIME</text>
    <text x="14" y="42" fill="#f0f1ff" font-size="14" font-weight="700">anthropic.claude-sonnet-4-6</text>
    <text x="14" y="60" fill="#aebbe0" font-size="11">Converse API · tool_use schemas</text>
    <text x="14" y="76" fill="#aebbe0" font-size="11">Streaming · per-tenant capacity</text>
    <text x="14" y="92" fill="#aebbe0" font-size="11">Region: eu-north-1 (model access requested)</text>
  </g>
  <g transform="translate(1100,300)">
    <rect width="210" height="80" rx="12" fill="rgba(15,16,48,0.55)" stroke="rgba(229,49,138,0.32)"/>
    <text x="14" y="22" fill="#ff7eb6" font-size="10" font-weight="700" letter-spacing="1">BEDROCK AGENT (alt)</text>
    <text x="14" y="42" fill="#f0f1ff" font-size="13" font-weight="700">Lambda action group</text>
    <text x="14" y="60" fill="#aebbe0" font-size="11">Optional path · iter-22</text>
    <text x="14" y="76" fill="#aebbe0" font-size="11">Replaces hand-rolled loop</text>
  </g>
  <g transform="translate(1330,300)">
    <rect width="210" height="80" rx="12" fill="rgba(15,16,48,0.55)" stroke="rgba(229,49,138,0.32)"/>
    <text x="14" y="22" fill="#ff7eb6" font-size="10" font-weight="700" letter-spacing="1">BEDROCK GUARDRAILS</text>
    <text x="14" y="42" fill="#f0f1ff" font-size="13" font-weight="700">Output filter (planned)</text>
    <text x="14" y="60" fill="#aebbe0" font-size="11">Block PII · jailbreak attempts</text>
    <text x="14" y="76" fill="#aebbe0" font-size="11">iter-23</text>
  </g>

  <!-- ═══ Security group ═══ -->
