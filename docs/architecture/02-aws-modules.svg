  <!-- Fargate -> Secrets Manager -->
  <path d="M170,280 L170,490" stroke="#ffd066" stroke-width="1.5" fill="none" marker-end="url(#aG)"/>
  <text x="180" y="380" font-size="9" fill="#ffd066">GetSecretValue at boot + every 24 h</text>

  <!-- Fargate -> CloudWatch Logs -->
