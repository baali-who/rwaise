    <text x="14" y="40" fill="#f0f1ff" font-size="13" font-weight="700">Built-in + custom</text>
    <text x="14" y="58" fill="#aebbe0" font-size="11">ALB 5xx rate · target health</text>
    <text x="14" y="74" fill="#aebbe0" font-size="11">Fargate CPU/memory · RDS conn</text>
    <text x="14" y="90" fill="#aebbe0" font-size="11">Custom: rwaise.agent.cost_usd</text>
    <text x="14" y="106" fill="#aebbe0" font-size="11">Custom: rwaise.x402.payments</text>
  </g>
  <g transform="translate(660,720)">
    <rect width="280" height="120" rx="12" fill="rgba(15,16,48,0.55)" stroke="rgba(124,92,255,0.32)"/>
    <text x="14" y="22" fill="#b896ff" font-size="10" font-weight="700" letter-spacing="1">SNS · ALERTING</text>
    <text x="14" y="40" fill="#f0f1ff" font-size="13" font-weight="700">PagerDuty + Slack</text>
    <text x="14" y="58" fill="#aebbe0" font-size="11">P1: 5xx &gt; 1% for 5 min</text>
    <text x="14" y="74" fill="#aebbe0" font-size="11">P2: Bedrock errors &gt; 10/min</text>
    <text x="14" y="90" fill="#aebbe0" font-size="11">P3: agent cost &gt; $50/hour</text>
    <text x="14" y="106" fill="#aebbe0" font-size="11">P4: feature flag DB drift</text>
  </g>
  <g transform="translate(960,720)">
    <rect width="280" height="120" rx="12" fill="rgba(15,16,48,0.55)" stroke="rgba(124,92,255,0.32)"/>
    <text x="14" y="22" fill="#b896ff" font-size="10" font-weight="700" letter-spacing="1">X-RAY (planned)</text>
    <text x="14" y="40" fill="#f0f1ff" font-size="13" font-weight="700">Distributed tracing</text>
    <text x="14" y="58" fill="#aebbe0" font-size="11">Request → Bedrock → Coinbase</text>
    <text x="14" y="74" fill="#aebbe0" font-size="11">→ XRPL submission spans</text>
    <text x="14" y="90" fill="#aebbe0" font-size="11">Service map for the 6 tools</text>
    <text x="14" y="106" fill="#aebbe0" font-size="11">iter-24</text>
  </g>
  <g transform="translate(1260,720)">
    <rect width="280" height="120" rx="12" fill="rgba(15,16,48,0.55)" stroke="rgba(124,92,255,0.32)"/>
    <text x="14" y="22" fill="#b896ff" font-size="10" font-weight="700" letter-spacing="1">BACKUPS · DR</text>
    <text x="14" y="40" fill="#f0f1ff" font-size="13" font-weight="700">RDS automated + manual</text>
    <text x="14" y="58" fill="#aebbe0" font-size="11">Daily snapshots → S3 cross-region</text>
    <text x="14" y="74" fill="#aebbe0" font-size="11">RTO 1 h · RPO 5 min</text>
    <text x="14" y="90" fill="#aebbe0" font-size="11">Tested quarterly</text>
    <text x="14" y="106" fill="#aebbe0" font-size="11">DR runbook in DEPLOYMENT.md</text>
  </g>

  <!-- ═══ Data flow arrows ═══ -->
  <text x="40" y="900" font-size="12" font-weight="700" fill="#7c5cff" letter-spacing="2">DATA FLOWS · ARROWS</text>

  <!-- ALB -> Fargate -->
  <path d="M170,300 L170,280" stroke="#62ffd2" stroke-width="2" fill="none" marker-end="url(#aA)"/>
