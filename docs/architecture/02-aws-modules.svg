    <rect width="280" height="120" rx="12" fill="rgba(15,16,48,0.55)" stroke="rgba(124,92,255,0.32)"/>
    <text x="14" y="22" fill="#b896ff" font-size="10" font-weight="700" letter-spacing="1">CLOUDWATCH LOGS</text>
    <text x="14" y="40" fill="#f0f1ff" font-size="13" font-weight="700">/ecs/gopnik-web</text>
    <text x="14" y="58" fill="#aebbe0" font-size="11">Structured JSON · 30-day retention</text>
    <text x="14" y="74" fill="#aebbe0" font-size="11">Insights queries on agent activity</text>
    <text x="14" y="90" fill="#aebbe0" font-size="11">Subscription filter → S3 cold storage</text>
    <text x="14" y="106" fill="#aebbe0" font-size="11">Per-iteration log groups for migrations</text>
  </g>
  <g transform="translate(360,720)">
    <rect width="280" height="120" rx="12" fill="rgba(15,16,48,0.55)" stroke="rgba(124,92,255,0.32)"/>
