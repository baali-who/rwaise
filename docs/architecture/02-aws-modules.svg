    <text x="14" y="106" fill="#aebbe0" font-size="11">  alb / fargate / rds / redis</text>
  </g>
  <g transform="translate(1080,490)">
    <rect width="220" height="120" rx="12" fill="rgba(15,16,48,0.55)" stroke="rgba(0,229,184,0.32)"/>
