    <text x="14" y="58" fill="#aebbe0" font-size="11">- Encrypts Secrets Manager</text>
    <text x="14" y="74" fill="#aebbe0" font-size="11">- Encrypts RDS at rest</text>
    <text x="14" y="90" fill="#aebbe0" font-size="11">- Encrypts S3 SSE-KMS</text>
    <text x="14" y="106" fill="#aebbe0" font-size="11">- (opt) wraps wallet seeds</text>
  </g>
  <g transform="translate(540,490)">
    <rect width="240" height="120" rx="12" fill="rgba(15,16,48,0.55)" stroke="rgba(255,208,102,0.32)"/>
    <text x="14" y="22" fill="#ffd066" font-size="10" font-weight="700" letter-spacing="1">IAM</text>
    <text x="14" y="40" fill="#f0f1ff" font-size="13" font-weight="700">Roles &amp; policies</text>
    <text x="14" y="58" fill="#aebbe0" font-size="11">ecsTaskExecutionRole · pull ECR + logs</text>
    <text x="14" y="74" fill="#aebbe0" font-size="11">gopnik-task-role · Bedrock + Secrets</text>
    <text x="14" y="90" fill="#aebbe0" font-size="11">least-privilege per env</text>
    <text x="14" y="106" fill="#aebbe0" font-size="11">Access Analyzer review monthly</text>
  </g>

  <!-- ═══ Network group ═══ -->
  <rect x="820" y="430" width="740" height="200" rx="20" fill="rgba(0,229,184,0.05)" stroke="rgba(0,229,184,0.32)" stroke-width="1.5"/>
  <text x="840" y="466" font-size="12" font-weight="700" fill="#62ffd2" letter-spacing="2">NETWORK · EDGE</text>

  <g transform="translate(840,490)">
    <rect width="220" height="120" rx="12" fill="rgba(15,16,48,0.55)" stroke="rgba(0,229,184,0.32)"/>
    <text x="14" y="22" fill="#62ffd2" font-size="10" font-weight="700" letter-spacing="1">VPC</text>
    <text x="14" y="40" fill="#f0f1ff" font-size="13" font-weight="700">2 public + 2 private subnets</text>
    <text x="14" y="58" fill="#aebbe0" font-size="11">2 AZs · NAT gateway</text>
    <text x="14" y="74" fill="#aebbe0" font-size="11">VPC flow logs to CloudWatch</text>
