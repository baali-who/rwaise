    <text x="14" y="40" fill="#f0f1ff" font-size="13" font-weight="700">gopnik/* secrets</text>
    <text x="14" y="58" fill="#aebbe0" font-size="11">- coinbase_api_key</text>
    <text x="14" y="74" fill="#aebbe0" font-size="11">- coinbase_api_secret</text>
    <text x="14" y="90" fill="#aebbe0" font-size="11">- db_password</text>
    <text x="14" y="106" fill="#aebbe0" font-size="11">- flask_secret_key</text>
