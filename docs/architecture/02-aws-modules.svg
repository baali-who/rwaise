<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" font-family="-apple-system,BlinkMacSystemFont,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1f"/>
      <stop offset="100%" stop-color="#1a0d2e"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5b8"/>
      <stop offset="60%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#e5318a"/>
    </linearGradient>
    <marker id="aA" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L0,12 L12,6 z" fill="#62ffd2"/></marker>
    <marker id="aP" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L0,12 L12,6 z" fill="#b896ff"/></marker>
    <marker id="aPk" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L0,12 L12,6 z" fill="#ff7eb6"/></marker>
    <marker id="aG" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L0,12 L12,6 z" fill="#ffd066"/></marker>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>

  <text x="800" y="52" text-anchor="middle" font-size="32" font-weight="800" fill="url(#brand)" letter-spacing="-1">AWS Module Map</text>
  <text x="800" y="80" text-anchor="middle" font-size="14" fill="#aebbe0">Every AWS service RWAiSE touches, grouped by concern</text>
  <rect x="600" y="92" width="400" height="2" fill="url(#brand)" rx="1"/>

  <!-- ═══ Compute group ═══ -->
  <rect x="40" y="120" width="500" height="280" rx="20" fill="rgba(0,229,184,0.05)" stroke="rgba(0,229,184,0.42)" stroke-width="1.5"/>
  <text x="60" y="156" font-size="12" font-weight="700" fill="#62ffd2" letter-spacing="2">COMPUTE</text>

  <g transform="translate(60,180)">
    <rect width="220" height="100" rx="12" fill="rgba(15,16,48,0.55)" stroke="rgba(0,229,184,0.32)"/>
    <text x="14" y="22" fill="#62ffd2" font-size="10" font-weight="700" letter-spacing="1">ECS · FARGATE</text>
    <text x="14" y="42" fill="#f0f1ff" font-size="14" font-weight="700">gopnik-web service</text>
    <text x="14" y="60" fill="#aebbe0" font-size="11">2 × (1 vCPU + 2 GB)</text>
    <text x="14" y="76" fill="#aebbe0" font-size="11">awsvpc · private subnets</text>
    <text x="14" y="92" fill="#aebbe0" font-size="11">Rolling deploys · zero downtime</text>
  </g>
  <g transform="translate(300,180)">
    <rect width="220" height="100" rx="12" fill="rgba(15,16,48,0.55)" stroke="rgba(0,229,184,0.32)"/>
    <text x="14" y="22" fill="#62ffd2" font-size="10" font-weight="700" letter-spacing="1">ECR</text>
    <text x="14" y="42" fill="#f0f1ff" font-size="14" font-weight="700">Container registry</text>
    <text x="14" y="60" fill="#aebbe0" font-size="11">Tag: gopnik:rwaise-vN.N.N</text>
    <text x="14" y="76" fill="#aebbe0" font-size="11">Image scan on push</text>
    <text x="14" y="92" fill="#aebbe0" font-size="11">Lifecycle policy: keep 10</text>
  </g>
  <g transform="translate(60,300)">
    <rect width="460" height="80" rx="12" fill="rgba(15,16,48,0.55)" stroke="rgba(0,229,184,0.32)"/>
    <text x="14" y="22" fill="#62ffd2" font-size="10" font-weight="700" letter-spacing="1">ALB · APPLICATION LOAD BALANCER</text>
    <text x="14" y="42" fill="#f0f1ff" font-size="14" font-weight="700">gopnik-prod-alb</text>
    <text x="14" y="60" fill="#aebbe0" font-size="11">HTTPS listener · ACM cert · WAF · sticky sessions</text>
    <text x="14" y="76" fill="#aebbe0" font-size="11">/health check · 5xx CloudWatch alarm</text>
  </g>

