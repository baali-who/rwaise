    <text x="14" y="40" fill="#f0f1ff" font-size="13" font-weight="700">DNS · gopnik.io</text>
    <text x="14" y="58" fill="#aebbe0" font-size="11">A record → ALB</text>
    <text x="14" y="74" fill="#aebbe0" font-size="11">CAA records pinned</text>
    <text x="14" y="90" fill="#aebbe0" font-size="11">Health checks every 30 s</text>
    <text x="14" y="106" fill="#aebbe0" font-size="11">Failover to maint page</text>
  </g>
  <g transform="translate(1320,490)">
    <rect width="220" height="120" rx="12" fill="rgba(15,16,48,0.55)" stroke="rgba(0,229,184,0.32)"/>
    <text x="14" y="22" fill="#62ffd2" font-size="10" font-weight="700" letter-spacing="1">CLOUDFRONT (planned)</text>
    <text x="14" y="40" fill="#f0f1ff" font-size="13" font-weight="700">CDN + WAF</text>
    <text x="14" y="58" fill="#aebbe0" font-size="11">iter-23: Lambda@Edge</text>
    <text x="14" y="74" fill="#aebbe0" font-size="11">x402 facilitator at edge</text>
    <text x="14" y="90" fill="#aebbe0" font-size="11">Rate limit 50 RPS / IP</text>
    <text x="14" y="106" fill="#aebbe0" font-size="11">DDoS protection</text>
  </g>

  <!-- ═══ Observability group ═══ -->
  <rect x="40" y="660" width="1520" height="200" rx="20" fill="rgba(124,92,255,0.05)" stroke="rgba(124,92,255,0.42)" stroke-width="1.5"/>
  <text x="60" y="696" font-size="12" font-weight="700" fill="#b896ff" letter-spacing="2">OBSERVABILITY · OPERATIONS</text>

