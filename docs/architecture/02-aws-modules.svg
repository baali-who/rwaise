  <text x="40" y="1080" font-size="11" fill="#7d89aa">github.com/baali-who/rwaise · MIT · iter-21</text>
  <text x="1560" y="1080" text-anchor="end" font-size="11" fill="#7d89aa">RWAiSE · AWS Modules · 2026</text>
