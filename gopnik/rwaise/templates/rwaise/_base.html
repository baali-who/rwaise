{# RWAiSE base layout — extends Gopnik's main base.html and injects scoped styles. #}
{% extends "base.html" %}

{% block head %}
{{ super() }}
<style>
  /* RWAiSE scoped styles. Match Gopnik's purple-cyan-emerald palette. */
  :root {
    --rwaise-grad: linear-gradient(135deg, #00e5b8 0%, #7c5cff 60%, #e5318a 100%);
    --rwaise-card: rgba(15, 16, 48, 0.55);
    --rwaise-card-border: rgba(124, 92, 255, 0.22);
    --rwaise-muted: #aebbe0;
    --rwaise-strong: #f0f1ff;
  }
  .rwaise-page-header {
    display: flex; align-items: baseline; gap: 14px;
    margin: 0 0 28px 0;
  }
  .rwaise-page-header h1 {
    margin: 0;
    background: var(--rwaise-grad);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text; color: transparent;
    font-size: 2rem; font-weight: 800; letter-spacing: -0.02em;
  }
  .rwaise-page-header .pill {
    background: rgba(0,229,184,0.14); color: #62ffd2;
    padding: 4px 10px; border-radius: 999px;
    font-size: 0.78rem; font-weight: 600; letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .rwaise-card {
    background: var(--rwaise-card);
    border: 1px solid var(--rwaise-card-border);
    border-radius: 16px;
    padding: 22px 24px;
    box-shadow: 0 8px 24px -12px rgba(124,92,255,0.20);
  }
  .rwaise-grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .rwaise-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; border-radius: 10px; border: 0;
    background: var(--rwaise-grad); color: #06060f;
    font-weight: 700; cursor: pointer; text-decoration: none;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .rwaise-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 24px -10px rgba(0,229,184,0.45);
  }
  .rwaise-btn-secondary {
    background: rgba(124,92,255,0.18);
    color: #d4cdff;
    border: 1px solid rgba(124,92,255,0.42);
  }
  .rwaise-tag-active     { color: #62ffd2; }
  .rwaise-tag-disabled   { color: #ff6b8b; }
  .rwaise-tag-warn       { color: #ffd066; }
  .rwaise-table { width: 100%; border-collapse: collapse; }
  .rwaise-table th, .rwaise-table td {
    padding: 10px 14px; text-align: left; vertical-align: middle;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    color: var(--rwaise-strong);
  }
  .rwaise-table th { color: var(--rwaise-muted); font-size: 0.78rem;
                     text-transform: uppercase; letter-spacing: 0.06em; }
  .rwaise-toggle {
    --w: 44px; --h: 24px;
    position: relative; display: inline-block; width: var(--w); height: var(--h);
  }
  .rwaise-toggle input { opacity: 0; width: 0; height: 0; }
  .rwaise-toggle .slider {
    position: absolute; inset: 0; cursor: pointer;
    background: rgba(255,255,255,0.10); border-radius: var(--h);
    transition: 0.18s;
  }
  .rwaise-toggle .slider::before {
    content: ""; position: absolute;
    width: calc(var(--h) - 4px); height: calc(var(--h) - 4px);
    left: 2px; top: 2px;
    background: white; border-radius: 50%;
    transition: 0.18s;
  }
  .rwaise-toggle input:checked + .slider { background: var(--rwaise-grad); }
  .rwaise-toggle input:checked + .slider::before { transform: translateX(calc(var(--w) - var(--h))); }
</style>
{% endblock %}

{% block content %}
<div class="rwaise-shell" style="max-width: 1200px; margin: 28px auto; padding: 0 20px;">
  {% block rwaise_content %}{% endblock %}
</div>
{% endblock %}
